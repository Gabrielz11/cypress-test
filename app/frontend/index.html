<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Antigravity App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <main class="login-container">
        <form id="loginForm" class="login-card">
            <div class="card-header">
                <h1>Bem-vindo</h1>
                <p>Faça login para acessar sua conta</p>
            </div>
            
            <div id="message" class="message"></div>
            
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
                <span id="email-error" class="error-text">O e-mail é obrigatório</span>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <span id="password-error" class="error-text">A senha é obrigatória</span>
            </div>
            
            <button type="submit" id="loginBtn" disabled>Entrar</button>
            
            <div class="card-footer">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
